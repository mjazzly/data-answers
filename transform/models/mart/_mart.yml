version: 2

# The accepted values below are the vocabulary in metrics.json; test/vocab.js checks them against it.
models:
  - name: fct_orders
    description: One row per order in the columns, types and order of data/orders.csv, plus export_batch.
    columns:
      - name: order_id
        data_tests: [unique, not_null]   # G8, G9
      - name: branch
        data_tests:
          - not_null
          - accepted_values:
              arguments: { values: ["Central", "Harbour", "Riverside", "Hillside", "Old Town", "Westgate", "Northpoint", "Airport"] }
      - name: order_date
        data_tests: [not_null]
      - name: month
        data_tests:
          - not_null
          - accepted_values:
              arguments: { values: ["2025-01", "2025-02", "2025-03", "2025-04", "2025-05", "2025-06", "2025-07", "2025-08", "2025-09", "2025-10", "2025-11", "2025-12"] }
      - name: quarter
        data_tests:
          - not_null
          - accepted_values:
              arguments: { values: ["2025-Q1", "2025-Q2", "2025-Q3", "2025-Q4"] }
      - name: category
        data_tests:
          - not_null
          - accepted_values:
              arguments: { values: ["Kitchen", "Cooling", "Garment Care", "Personal Care"] }
      - name: channel
        data_tests:
          - not_null
          - accepted_values:
              arguments: { values: ["In store", "Online", "Phone"] }
      - name: order_value
        data_tests: [not_null]
      - name: returned
        data_tests: [not_null]
      - name: export_batch
        data_tests: [not_null]

unit_tests:
  - name: u7_returned_from_the_return_events
    model: fct_orders
    given:
      - input: ref('stg_orders')
        rows:
          - { order_id: ORD-1, branch: Central, order_date: 2025-03-04, month: 2025-03, quarter: 2025-Q1, category: Kitchen, channel: Online, order_value: 75.00, export_batch: 1 }
          - { order_id: ORD-2, branch: Central, order_date: 2025-03-04, month: 2025-03, quarter: 2025-Q1, category: Kitchen, channel: Online, order_value: 80.00, export_batch: 1 }
      - input: ref('stg_returns')
        rows:
          - { order_id: ORD-1, events: 1, export_batch: 1 }
    expect:
      rows:
        - { order_id: ORD-1, returned: true }
        - { order_id: ORD-2, returned: false }
