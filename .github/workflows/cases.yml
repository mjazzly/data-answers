# The gate between a change and the live demo (demo/GATE.md). On every push to any branch, and on
# dispatch (the weekly rerun from cron-job.org calls the dispatch endpoint for main):
#   0. No key: the tested tables (transform/DESIGN.md). The raw export must be what scripts/make_raw.js
#      writes, dbt build runs every model and test on it, and the export from fct_orders must equal
#      data/orders.csv and data/batch_2.csv byte for byte, so a bad row stops the run here. The
#      dashboard's Parquet file must hold exactly the rows of fct_orders, the dashboard check must
#      pass its stand-in project, and the Power BI project itself must pass it: the model, and the
#      fourteen cases of agreement.tsv (dashboard/DESIGN.md).
#   1. No key: the harness mock, the demo's mock check, the demo's tests, the demo's build.
#   2. On main only, with the data-answers-ci workspace key: the twenty-eight cases through the demo's
#      own path on the smallest model, marked by eval/check.js against the bar in harness.json
#      (demo/scripts/ci.js; one rerun of the whole pass before red). Any other branch runs 0 and 1
#      only and spends nothing; its cases first run when it reaches main.
#   3. On main only: the record is committed to results/ci/ with the [ci] prefix, green or red. A run
#      that met the bar only on the rerun is "green after rerun": it still moves live, and the workflow
#      opens one issue naming the cases pass 1 missed (GitHub emails the owner), as demo record does
#      for the spend lines.
#   4. On main and green only: live is moved to the commit that passed, and Vercel is asked to build it
#      through the deploy hook (Vercel made no deployment when this workflow first pushed live). Vercel
#      production tracks live, so nothing reaches a visitor from a red run or from any other branch.
# Measure mode (dispatch with measure above 0): N passes, no gate, the record to results/ci-measure/,
# live never moves. This workflow never connects to the demo's database.
# Commits made with the workflow's own token start no new workflow run.
name: cases
on:
  push:
    paths-ignore:
      - "results/**"
  workflow_dispatch:
    inputs:
      measure:
        description: "Passes to measure, with no gate (0 = the gate)"
        default: "0"
      effort:
        description: "Effort for measure only: blank (the service's), low, medium, high, xhigh or max"
        default: ""
permissions:
  contents: write
  issues: write
concurrency:
  group: cases-${{ github.ref }}
  cancel-in-progress: false
env:
  MEASURE: ${{ inputs.measure || '0' }}
  EFFORT: ${{ inputs.effort }}
jobs:
  cases:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            demo/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: demo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: transform/requirements.txt
      - run: pip install -r transform/requirements.txt
      - name: Tested tables with no key
        run: |
          node scripts/make_raw.js
          git diff --exit-code -- transform/seeds/raw
          (cd transform && dbt build)
          node scripts/export_mart.js
          cmp data/orders.csv transform/target/export/orders.csv
          cmp data/batch_2.csv transform/target/export/batch_2.csv
          node test/vocab.js
          node scripts/export_dashboard.js --check
          node test/dashboard.js
          node scripts/check_dashboard.js --no-record
      - name: Tests with no key
        run: |
          npm run mock
          cd demo
          npm run check -- --mock
          npm test
          npm run build
      - name: The twenty-eight cases on the smallest model
        id: cases
        if: github.ref == 'refs/heads/main'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          args=()
          dir=results/ci
          if [ "$MEASURE" != "0" ]; then args+=(--measure "$MEASURE"); dir=results/ci-measure; fi
          [ -n "$EFFORT" ] && args+=(--effort "$EFFORT")
          [ "$GITHUB_REF" = refs/heads/main ] && args+=(--record "$dir")
          node demo/scripts/ci.js "${args[@]}"
      - name: Add the tested tables to the record
        if: always() && github.ref == 'refs/heads/main' && (steps.cases.outcome == 'success' || steps.cases.outcome == 'failure')
        run: node scripts/record_models.js "$([ "$MEASURE" != "0" ] && echo results/ci-measure || echo results/ci)"
      - name: Keep the record
        if: always() && github.ref == 'refs/heads/main' && (steps.cases.outcome == 'success' || steps.cases.outcome == 'failure')
        run: |
          [ -n "$(git status --porcelain -- results)" ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          if [ "$MEASURE" != "0" ]; then msg="[ci] measure, $MEASURE passes for ${GITHUB_SHA::7}, effort ${EFFORT:-unset}"
          else msg="[ci] 28 cases for ${GITHUB_SHA::7}: ${{ steps.cases.outputs.status || (steps.cases.outcome == 'success' && 'green' || 'red') }}"; fi
          git commit -m "$msg"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Move live to the commit that passed
        if: success() && github.ref == 'refs/heads/main' && env.MEASURE == '0'
        run: git push origin "${GITHUB_SHA}:refs/heads/live"
      - name: Ask Vercel to build live
        if: success() && github.ref == 'refs/heads/main' && env.MEASURE == '0'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          [ -n "$HOOK" ] || { echo "::error::No VERCEL_DEPLOY_HOOK secret: live moved, but Vercel was not asked to build it"; exit 1; }
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Vercel asked to build live at ${GITHUB_SHA::7}; the build rule in demo/vercel.json decides whether it builds"
      - name: Open an issue for a green after rerun
        if: always() && github.ref == 'refs/heads/main' && env.MEASURE == '0' && steps.cases.outcome == 'success' && steps.cases.outputs.status == 'green after rerun'
        env:
          GH_TOKEN: ${{ github.token }}
          MISSES: ${{ steps.cases.outputs.pass1_misses }}
          LIST: ${{ steps.cases.outputs.pass1_list }}
        run: |
          title="Gate green only after rerun on ${GITHUB_SHA::7}: pass 1 missed $MISSES"
          if [ -z "$(gh issue list --state all --search "\"$title\" in:title" --json number -q '.[0].number')" ]; then
            gh issue create --title "$title" --body "$(printf '%s\n\n%s\n\n%s\n' \
              "The twenty-eight cases met the bar on ${GITHUB_SHA::7} only when the whole pass ran a second time, so it gated as green and live moved to it. Pass 1 missed these, each with its first failing line:" \
              "$LIST" \
              "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Record: results/ci/, the file for ${GITHUB_SHA::7} (status and pass1_misses, with every line in passes[0]). A case that misses only sometimes is a change worth reading before the next push. @mjazzly")"
          fi
