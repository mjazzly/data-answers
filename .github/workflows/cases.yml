# The gate between a change and the live demo (demo/GATE.md). On every push to any branch, and on
# dispatch (the weekly rerun from cron-job.org calls the dispatch endpoint for main):
#   1. No key: the harness mock, the demo's mock check, the demo's tests, the demo's build.
#   2. With the data-answers-ci workspace key: the twenty-eight cases through the demo's own path on the
#      smallest model, marked by eval/check.js against the bar in harness.json (demo/scripts/ci.js; one
#      rerun of the whole pass before red).
#   3. On main only: the record is committed to results/ci/ with the [ci] prefix, green or red.
#   4. On main and green only: live is moved to the commit that passed, and Vercel is asked to build it
#      through the deploy hook (Vercel made no deployment when this workflow first pushed live). Vercel
#      production tracks live, so nothing reaches a visitor from a red run or from any other branch.
# Measure mode (dispatch with measure above 0): N passes, no gate, the record to results/ci-measure/,
# live never moves. This workflow never connects to the demo's database.
# Commits made with the workflow's own token start no new workflow run.
name: cases
on:
  push:
    paths-ignore:
      - "results/**"
  workflow_dispatch:
    inputs:
      measure:
        description: "Passes to measure, with no gate (0 = the gate)"
        default: "0"
      effort:
        description: "Effort for measure only: blank (the service's), low, medium, high, xhigh or max"
        default: ""
permissions:
  contents: write
concurrency:
  group: cases-${{ github.ref }}
  cancel-in-progress: false
env:
  MEASURE: ${{ inputs.measure || '0' }}
  EFFORT: ${{ inputs.effort }}
jobs:
  cases:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            demo/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: demo
      - name: Tests with no key
        run: |
          npm run mock
          cd demo
          npm run check -- --mock
          npm test
          npm run build
      - name: The twenty-eight cases on the smallest model
        id: cases
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          args=()
          dir=results/ci
          if [ "$MEASURE" != "0" ]; then args+=(--measure "$MEASURE"); dir=results/ci-measure; fi
          [ -n "$EFFORT" ] && args+=(--effort "$EFFORT")
          [ "$GITHUB_REF" = refs/heads/main ] && args+=(--record "$dir")
          node demo/scripts/ci.js "${args[@]}"
      - name: Keep the record
        if: always() && github.ref == 'refs/heads/main' && (steps.cases.outcome == 'success' || steps.cases.outcome == 'failure')
        run: |
          [ -n "$(git status --porcelain -- results)" ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          if [ "$MEASURE" != "0" ]; then msg="[ci] measure, $MEASURE passes for ${GITHUB_SHA::7}, effort ${EFFORT:-unset}"
          else msg="[ci] 28 cases for ${GITHUB_SHA::7}: ${{ steps.cases.outcome == 'success' && 'green' || 'red' }}"; fi
          git commit -m "$msg"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Move live to the commit that passed
        if: success() && github.ref == 'refs/heads/main' && env.MEASURE == '0'
        run: git push origin "${GITHUB_SHA}:refs/heads/live"
      - name: Ask Vercel to build live
        if: success() && github.ref == 'refs/heads/main' && env.MEASURE == '0'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          [ -n "$HOOK" ] || { echo "::error::No VERCEL_DEPLOY_HOOK secret: live moved, but Vercel was not asked to build it"; exit 1; }
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Vercel asked to build live at ${GITHUB_SHA::7}; the build rule in demo/vercel.json decides whether it builds"
