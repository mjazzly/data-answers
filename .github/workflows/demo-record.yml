# The demo's own record and alerts. No secret is needed: the numbers come from the demo's public
# /api/stats, and the job writes with the repository's own token.
#   Hourly: if this month's counted spend has crossed 50% or 75% of the workspace limit (the app
#           closes free text at 75%), open one issue for that line. GitHub emails the owner.
#   Every run: write each finished UTC day that has no record yet to results/, from the demo's first day
#           and never more than 35 days back (demo/scripts/missing-days.js). The counters live 40 days,
#           so a run that was late or skipped is caught up by the next one. A daily dispatch from
#           cron-job.org at 8:23 AM Kuala Lumpur time (00:23 UTC) stands behind GitHub's own schedule.
name: demo record
on:
  schedule:
    - cron: "10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency: demo-record
env:
  DEMO_URL: ${{ vars.DEMO_URL }}
jobs:
  record:
    runs-on: ubuntu-latest
    if: ${{ vars.DEMO_URL != '' }}
    steps:
      - uses: actions/checkout@v5
      - name: Alert lines
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          s=$(curl -fsS "$DEMO_URL/api/stats")
          share=$(echo "$s" | jq -r '.share_of_workspace // 0')
          month=$(echo "$s" | jq -r '.month')
          cost=$(echo "$s" | jq -r '.cost_month_usd')
          limit=$(echo "$s" | jq -r '.workspace_limit_usd')
          for line in 50 75; do
            if awk "BEGIN{exit !($share*100 >= $line)}"; then
              title="Demo spend crossed ${line}% of the workspace limit, $month"
              if [ -z "$(gh issue list --state all --search "\"$title\" in:title" --json number -q '.[0].number')" ]; then
                gh issue create --title "$title" --body "Counted spend this month is US\$$cost of the US\$$limit workspace limit. At 75% the app closes free text until the month ends; presets keep working. To close it now: Upstash console, CLI tab, \`SET da:free_text off\`. @mjazzly"
              fi
            fi
          done
      - name: Daily record, catching up
        run: |
          days=$(node demo/scripts/missing-days.js results)
          [ -n "$days" ] || exit 0
          for day in $days; do
            curl -fsS "$DEMO_URL/api/stats?day=$day" | jq --arg at "$(date -u +%FT%TZ)" '{day, questions, daily_cap, ip_cap, cost_day_usd, month, cost_month_usd, month_questions, blocked, free_text, model, written_at: $at}' > "$RUNNER_TEMP/day.json"
            mv "$RUNNER_TEMP/day.json" "results/demo-$day.json"
          done
          set -- $days
          [ $# -eq 1 ] && msg="Record the demo's day $1: questions and cost" || msg="Record the demo's missing days, $1 to ${!#}: questions and cost"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          git diff --cached --quiet && exit 0
          git commit -m "$msg"
          git pull --rebase origin main
          git push origin HEAD:main
